<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="KIYOSHI - banner" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05030a"/>
    <stop offset="0.6" stop-color="#0d0b14"/>
    <stop offset="1" stop-color="#1e0b3a"/>
  </linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" opacity="0.35"/>
  </pattern>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#8b5cf6" stroke-opacity="0.08"/>
  </pattern>
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
  </radialGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  text { font-family: 'Courier New', Courier, monospace; }
  .rain { font-size: 14px; fill: #8b5cf6; opacity: 0.0; animation-name: fall; animation-iteration-count: infinite; animation-timing-function: linear; }
  @keyframes fall {
    0%   { transform: translateY(0);     opacity: 0; }
    10%  { opacity: .5; }
    90%  { opacity: .25; }
    100% { transform: translateY(420px); opacity: 0; }
  }
  .title { font-size: 104px; font-weight: 900; letter-spacing: 14px; text-anchor: middle; }
  .t-main { fill: #f3e8ff; }
  .t-pur  { fill: #a855f7; mix-blend-mode: screen; animation: gl1 3.2s infinite steps(1); }
  .t-cyan { fill: #22d3ee; mix-blend-mode: screen; animation: gl2 3.2s infinite steps(1); }
  .t-main-g { animation: jit 3.2s infinite steps(1); }
  @keyframes gl1 {
    0%,100% { transform: translate(-3px,0); }
    30% { transform: translate(-3px,0); }
    31% { transform: translate(-14px,2px); }
    33% { transform: translate(8px,-3px); }
    35% { transform: translate(-3px,0); }
    71% { transform: translate(-18px,0); }
    73% { transform: translate(-3px,0); }
  }
  @keyframes gl2 {
    0%,100% { transform: translate(3px,0); }
    30% { transform: translate(3px,0); }
    31% { transform: translate(14px,-2px); }
    33% { transform: translate(-8px,3px); }
    35% { transform: translate(3px,0); }
    71% { transform: translate(18px,0); }
    73% { transform: translate(3px,0); }
  }
  @keyframes jit {
    0%,100% { transform: translate(0,0); }
    31% { transform: translate(4px,-1px); }
    33% { transform: translate(-4px,1px); }
    35% { transform: translate(0,0); }
    72% { transform: translate(2px,0); }
    73% { transform: translate(0,0); }
  }
  .tag { font-size: 13px; fill: #a78bfa; letter-spacing: 2px; }
  .blink { animation: bl 1s infinite steps(1); }
  @keyframes bl { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
  .flick { animation: fk 4.5s infinite steps(1); }
  @keyframes fk { 0%,100% { opacity: 1; } 20% { opacity: .3; } 21% { opacity: 1; } 60% { opacity: .5; } 61% { opacity: 1; } }
  .bar { fill: #22d3ee; opacity: 0; animation: tear 3.2s infinite steps(1); }
  @keyframes tear {
    0%,100% { opacity: 0; }
    31% { opacity: .35; transform: translateY(0); }
    32% { opacity: .35; transform: translateY(26px); }
    33% { opacity: 0; }
    71% { opacity: .3; transform: translateY(-18px); }
    72% { opacity: 0; }
  }
  .sweep { fill: #8b5cf6; opacity: .08; animation: sw 6s linear infinite; }
  @keyframes sw { 0% { transform: translateY(-40px); } 100% { transform: translateY(300px); } }
</style>

<rect width="900" height="260" fill="url(#bg)"/>
<rect width="900" height="260" fill="url(#grid)"/>
